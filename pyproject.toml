[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lens-template-topography"
version = "0.1.0"
description = "Lens template recognition, localization, and refractive power topography pipeline."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "Pillow>=9.0",
  "PyYAML>=5.3",
]
authors = [
  { name = "Dongting Shuo" }
]
license = { text = "GPL-3.0-or-later" }
keywords = ["lens", "computer-vision", "localization", "topography", "optical-metrology"]

[project.optional-dependencies]
yolo = [
  "opencv-python>=4.5",
  "torch>=1.13",
  "torchvision>=0.14",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.8",
]

[project.scripts]
lens-locate = "lens_locator.cli:main"
lens-topography = "lens_locator.cli:main"

[tool.setuptools.packages.find]
include = ["lens_locator*"]
